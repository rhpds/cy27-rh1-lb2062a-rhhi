# Approval checklist — filled collaboratively by author + skill + system + reviewers
approval_checklist:

  content:
    prerequisites_verifiable: false
    assessment_strategy: ""
    catalog_gap: ""
    design_overview: "A 130-minute intermediate hands-on lab that walks developers and platform engineers through Red Hat Hardened Images (RHHI) across five progressively complex modules: establishing a UBI size baseline, exploring distroless and builder variants, implementing multi-stage builds and debug sidecar operations, enforcing FIPS 140-3 cryptographic policy via the FIPS variant, and deploying a fully hardened Podman pod with a Caddy TLS reverse proxy and embedded CA trust. All work is performed via CLI on a per-student RHEL VM using Podman with a pre-staged Flask demo application; no OpenShift or Kubernetes knowledge is required."
    module_summaries:
      - title: "Introduction to Red Hat Hardened Images / UBI Baseline"
        overview: "Participants build and run the pre-staged rhhi-demo Flask application on a UBI base image using Podman, then record image size and installed package count as a measurable baseline for comparing all subsequent RHHI variants."
      - title: "Hardened Image Variants (Distroless and Variants)"
        overview: "Participants attempt a single-stage build on the distroless hi/python:3.14 image, observe and analyze the build failure caused by the missing shell, switch to the builder variant to succeed, and compare image sizes across UBI, distroless, and builder — establishing that builder is for build time, not production."
      - title: "Multi-Stage Builds and Operating Hardened Images"
        overview: "Participants implement a multi-stage Containerfile to produce a minimal production distroless image, then tackle the operational challenge of inspecting a running shellless container by building a debug sidecar from core-runtime:latest-builder with busybox and attaching it via shared PID and network namespaces."
      - title: "Customized Security Images (FIPS Variant)"
        overview: "Participants build and run the RHHI FIPS Python variant with no application code changes, observe that MD5 is blocked while SHA-256 and SHA-512 succeed, and confirm that FIPS 140-3 enforcement is container-level and independent of the host OS FIPS mode."
      - title: "TLS Reverse Proxy with Hardened Images"
        overview: "Participants deploy a Podman pod running the hardened Flask app and a Caddy TLS reverse proxy, encounter a TLS trust failure from an internal CA, extract and inspect the root certificate, then build a custom curl image with the CA bundle embedded to verify successful HTTPS access."
    rcars_overlap_pct: null
    rcars_top_matches: []
    rejections: []

