spec:
  title: "Red Hat Hardened Images"
  learning_objectives:
    - "Build container images using Red Hat Hardened Image distroless, builder, and FIPS variants and compare image sizes against a UBI baseline"
    - "Implement multi-stage builds to produce minimal, production-ready distroless container images"
    - "Operate a running distroless container by building and attaching a debug sidecar using shared PID and network namespaces"
    - "Verify FIPS 140-3 cryptographic policy enforcement by building and running the RHHI FIPS image variant and observing blocked and allowed cipher operations"
    - "Deploy a Podman pod running a hardened application and a Caddy TLS reverse proxy, then resolve a certificate trust failure by embedding a CA bundle into a custom curl image"
  modules:
    - {id: module-01, title: "Introduction to Red Hat Hardened Images / UBI Baseline", duration_min: 15, status: not_started}
    - {id: module-02, title: "Hardened Image Variants (Distroless and Variants)", duration_min: 25, status: not_started}
    - {id: module-03, title: "Multi-Stage Builds and Operating Hardened Images", duration_min: 40, status: not_started}
    - {id: module-04, title: "Customized Security Images (FIPS Variant)", duration_min: 20, status: not_started}
    - {id: module-05, title: "TLS Reverse Proxy with Hardened Images", duration_min: 30, status: not_started}
